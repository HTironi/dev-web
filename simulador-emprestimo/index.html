<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Empréstimo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="formulario">
        <h1>
            Simulador de Empréstimo
        </h1>
        <form>
            <label for="bruto">Renda Bruta Mensal (R$):</label>
            <input id="bruto" type="number" placeholder="Digite sua renda bruta mensal">
            <label for="valor">Valor do Empréstimo (R$):</label>
            <input id="valor" type="number" placeholder="Digite o valor do empréstimo">
            <label for="prazo">Renda Bruta Mensal (meses):</label>
            <input id="prazo" type="number" placeholder="Digite o prazo em meses">

            <button id="submit" onclick="calculo">Calcular Parcelas</button>


        </form>


    </section>

    
</body>
<script src="script.js"></script>
</html>
